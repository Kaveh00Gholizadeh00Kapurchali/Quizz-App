<div class="max w md mx-auto mt-10 p-6 bg-whtie rounded-2 shadow-2xl">

    <h2 class="text-xl font-bold mb-4">Question: {{currentIndex() + 1}}</h2>
    <p class="mb-4 font-bold">{{currentQuestion().questionText}}</p>
    <div class="flex flex-col gap-2">

        @for (option of currentQuestion().options; track option) {
            <button class="border p-2 rounded hover:bg-gray-100" (click)="answer(option)">{{option}}</button>
        }
        

    </div>
</div>
